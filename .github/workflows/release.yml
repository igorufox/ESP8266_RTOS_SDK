name: Release

# The PlatformIO package framework-esp8266-rtos-sdk of the espurna branch, packed as a zip with the submodules (lwip:
# GitHub's source archive of a tag has none). Every run keeps the package as an artifact; a push to espurna also
# releases it: the tag is the version of package.json (3.4.0+espurna.3 -> 3.4.0-espurna.3), made by this workflow
# when that release does not exist yet - a new release is a version bump of package.json.
# No build here: ESPurna builds the SDK (scripts/esp8266_rtos_sdk.py).
on:
  push:
    branches: [espurna]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        run: |
          TAG=$(python3 -c "import json; print(json.load(open('package.json'))['version'].replace('+', '-'))")
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ZIP=framework-esp8266-rtos-sdk-$TAG.zip" >> "$GITHUB_ENV"
          if gh release view "$TAG" > /dev/null 2>&1; then echo "RELEASED=1" >> "$GITHUB_ENV"; fi

      - name: Package
        run: |
          # the files of git, the submodules included (20.11: `zip -r .` with excludes exited 0 and wrote nothing)
          mkdir -p dist
          git ls-files --recurse-submodules | zip -q "dist/$ZIP" -@
          ls -l "dist/$ZIP"
          test -s "dist/$ZIP"
          unzip -l "dist/$ZIP" | grep -q "components/lwip/lwip/src/core/tcp.c"

      - uses: actions/upload-artifact@v4
        with:
          name: framework-esp8266-rtos-sdk
          path: dist/*.zip

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/espurna' && env.RELEASED != '1'
        run: gh release create "$TAG" "dist/$ZIP" --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE.md
